[package]
name        = "tsml"
version     = "0.1.0"
description = "Temporally-Sparse Merkle Log — multi-algorithm append-only log with epoch semantics"
edition      = "2024"
rust-version = "1.85"

[dependencies]
# Zero external dependencies. Hash operations injected via the Hasher trait.

[dev-dependencies]
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
proptest = "1"
bigoish = "0.1"
big_o = "0.1"
cpu-time = "1"
