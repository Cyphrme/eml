[package]
name          = "neml"
version       = "0.1.0"
description   = "Unified n-ary Merkle append-only log tree"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"

[dependencies]
# The kernel; neml is the transitional append-only layer over it.
pmt = { path = "../pmt" }

[dev-dependencies]
sha2 = "0.10"
bigoish = "0.1"
big_o = "0.1"
cpu-time = "1"
proptest = "1"
smol = "2.0"
eml = { path = ".." }

