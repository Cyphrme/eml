[package]
name          = "eml"
version       = "0.12.0"
description   = "Epoch Merkle Log: the EML library instantiated at k=2, no prefix"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"
documentation = "https://docs.rs/eml"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "eml"

[dependencies]
# The EML library is the polydigest combinator over the CML single-algorithm
# engine; this crate is its k=2, no-prefix instantiation.
polydigest = { version = "0.1", path = "../polydigest" }

[dev-dependencies]
sha2 = "0.10"
bigoish = "0.1"
big_o = "0.1"
cpu-time = "1"
proptest = "1"
smol = "2.0"
polydigest = { version = "0.1", path = "../polydigest" }
