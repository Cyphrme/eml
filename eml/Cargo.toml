[package]
name          = "eml"
version       = "0.1.0"
description   = "EML — the append-only engineering library over the PMT kernel"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"

[dependencies]
# The kernel; EML is the append-only engineering library over it.
pmt = { path = "../pmt" }

[dev-dependencies]
sha2 = "0.10"
bigoish = "0.1"
big_o = "0.1"
cpu-time = "1"
proptest = "1"
smol = "2.0"
