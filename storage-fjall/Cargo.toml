[package]
name          = "storage-fjall"
version       = "0.1.0"
description   = "Fjall-backed storage backend for the EML append-only library"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"
documentation = "https://docs.rs/storage-fjall"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[dependencies]
# The Storage trait is the polydigest combinator's; this backend implements it.
polydigest = { version = "0.1", path = "../polydigest" }
fjall      = "3"
thiserror  = "2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
smol = "2"
proptest = "1"
