[package]
name          = "cmt"
version       = "0.1.0"
description   = "Canonical Mutable Tree — the single-algorithm mutable tree over the Merkle Spine"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"
documentation = "https://docs.rs/cmt"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The structural core; cmt is the single-algorithm mutable tree over it.
# Epoch-free (no binding root, no timeline): those are the `polydigest` combinator's.
spine = { version = "0.1", path = "../spine" }

[dev-dependencies]
sha2 = "0.10"
proptest = "1"
spine = { version = "0.1", path = "../spine" }
