[package]
name          = "cmt"
version       = "0.1.0"
description   = "Canonical Mutable Tree — the single-algorithm mutable tree over the Merkle Spine"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"

[dependencies]
# The structural core; cmt is the single-algorithm mutable tree over it.
# Epoch-free (no binding root, no timeline): those are the `epoch` combinator's.
spine = { path = "../spine" }

[dev-dependencies]
sha2 = "0.10"
proptest = "1"
