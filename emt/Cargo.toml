[package]
name          = "emt"
version       = "0.1.0"
description   = "Epoch Merkle Tree — the EMT instantiated at k=2 with no prefix"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"

[dependencies]
# The EMT instantiation = polydigest(cmt)@k2. The mutable structural tree (cmt)
# lifted by the polydigest combinator (binding root + combined currency).
polydigest = { path = "../polydigest" }
# The concrete hash this instantiation fixes (unprefixed SHA-256).
sha2 = "0.10"
