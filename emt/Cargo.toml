[package]
name          = "emt"
version       = "0.1.0"
description   = "Epoch Merkle Tree — the mutable engineering library over the PMT kernel"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"

[dependencies]
# The kernel; emt is the mutable engineering layer over it. No EML edge (C-DAG).
pmt = { path = "../pmt" }

[dev-dependencies]
sha2 = "0.10"
proptest = "1"
