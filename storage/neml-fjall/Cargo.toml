[package]
name          = "neml-storage-fjall"
version       = "0.1.0"
description   = "Fjall-backed storage implementation for neml"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../../LICENSE"

[lib]
doctest = false

[dependencies]
neml = { version = "0.1.0", path = "../../neml" }
fjall      = "3"
thiserror  = "2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
smol = "2"
proptest = "1"
