[package]
# Named `storage-git` (not `polydigest-storage-git`, unlike its sibling
# `polydigest-storage-fjall`) so `cargo test -p storage-git` -- the
# evaluator this crate's own dispatch names -- resolves; the sibling's own
# `-p storage-fjall` does not resolve today for the identical reason
# (package name vs. directory name already diverge there), so this is a
# deliberate, evaluator-driven departure from that naming convention rather
# than an oversight.
name          = "storage-git"
version       = "0.1.0"
description   = "Git-backed storage backend for the EML append-only library"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"
documentation = "https://docs.rs/storage-git"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "storage_git"
doctest = false

[dependencies]
# The Storage trait is the polydigest combinator's; this backend implements it.
polydigest = { version = "0.1", path = "../polydigest" }
# Structural primitives (frontier decomposition, arity range) shared with the
# rest of the log stack -- already a transitive dependency via polydigest, so
# depending on it directly names no new layer.
spine      = { package = "merkle-spine", path = "../spine" }
gix        = { version = "=0.87.1", features = ["sha256"] }
thiserror  = "2"

[dev-dependencies]
sha2      = "0.10"
tempfile  = "3"
smol      = "2"
proptest  = "1"
# `cml::engine::AlgView` is a test-only parity oracle now (`src/layout.rs`'s
# `epochs_at` unit tests, and the acceptance suite's SG3/SG8/SG13 checks
# against `cml::engine`) -- this crate's own write/read path never links
# `cml` at all, since `tree_at`'s `roots/`-folding reconstruction (the one
# thing that needed `cml::mountain::bag_peaks`) is deleted outright (SG26:
# this layer computes no digest and folds no root).
cml       = { package = "canonical-ml", path = "../cml" }
# The NO RECONSTRUCTION lint (tip_tree_contract.rs) parses `src/`'s own
# `.rs` files as syntax trees to enumerate GitStorage's/GitReadOnlyView's
# public methods by structural shape (impl block + fn signature), not by
# matching literal names -- a textual grep is evaded by a rename, an AST
# walk over `impl GitStorage` is not, since renaming a method or its
# containing module changes neither the type it is inherently implemented
# on nor the `pub` keyword the check keys on.
syn       = { version = "2", features = ["full", "visit"] }
quote     = "1"
