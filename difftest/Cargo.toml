[package]
name          = "difftest"
version       = "0.0.0"
description   = "Differential property tests pinning current log behavior against a frozen baseline"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"
publish       = false

# The crate is pure test scaffolding; the comparison cases live in tests/.
[lib]
path = "src/lib.rs"

[dependencies]
# The current side under audit: eml, the EML instantiation that succeeds
# the historical `neml`. It re-exports the full EML surface, so the harness
# drives it through the same `NaryMerkleLog` / `TreeConfig` / `proof` paths the
# baseline exposes.
eml = { path = "../eml" }
# The frozen baseline: a git worktree of the pre-campaign HEAD, materialized
# OUTSIDE this workspace's directory tree (a sibling worktree). Cargo absorbs
# any path dependency living *under* the workspace root as a workspace member,
# so the baseline must sit out of tree. Its package keeps the name `neml`
# (linked here under the `neml_baseline` alias) but carries a distinct
# `version` in that worktree's manifest so Cargo can tell it apart from the
# current side in the lockfile.
#
# One-time setup (run from the repo root after a fresh clone):
#   bash difftest/setup-baseline.sh
# See also the "Differential oracle" section in README.md.
neml_baseline = { path = "../../baseline-N1/neml", package = "neml" }
# The shared hashers in src/lib.rs drive both trees with byte-identical logic.
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
smol = "2.0"
