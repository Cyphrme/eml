[package]
name          = "etl"
version       = "0.1.0"
description   = "Epoch Transparency Log: EML at k=2, prefixed (RFC-9162) hashing, subtrees banned"
edition       = "2024"
rust-version  = "1.85"
license-file  = "../LICENSE"
repository    = "https://github.com/Cyphrme/eml"

[lib]
name = "etl"

[dependencies]
# The EML library instantiation; this crate fixes k=2 + prefixed Hasher over it.
eml = { path = "../eml" }

[dev-dependencies]
sha2 = "0.10"
smol = "2.0"
